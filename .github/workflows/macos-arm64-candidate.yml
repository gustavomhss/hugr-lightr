name: Hosted macOS arm64 candidate (partial qualification)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable lowercase 40-character candidate commit
        required: true
        type: string
permissions:
  contents: read
env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  WORKFLOW_SHA: ${{ github.sha }}
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      receipt-sha256: ${{ steps.build.outputs.receipt-sha256 }}
    env:
      LIGHTR_NET_TESTS: "1"
      RUSTFLAGS: "-D warnings -C link-arg=-Wl,-rpath,/usr/lib/swift"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: &checkout
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify immutable identity
        shell: bash
        run: &identity |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sysctl -n hw.optional.arm64)" = 1
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin
      - name: Calibrate candidate guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/macos-guards"
          "$RUNNER_TEMP/macos-guards/bin/python" -m pip install PyYAML==6.0.2
          "$RUNNER_TEMP/macos-guards/bin/python" scripts/ci/test_macos_candidate.py --require-apple-controls
          "$RUNNER_TEMP/macos-guards/bin/python" scripts/ci/test_macos_candidate_workflow.py
      - name: Build and verify hosted evidence
        id: build
        shell: bash
        run: python3 scripts/ci/macos_candidate.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: macos-candidate-${{ inputs.candidate_sha }}
          path: |
            packaging/dist/lightr-0.1.0-darwin-arm64-unsigned.tar.gz
            packaging/dist/lightr-0.1.0-darwin-arm64-unsigned.tar.gz.sha256
            macos-build/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: macos-build-logs-${{ inputs.candidate_sha }}
          path: macos-build/
          if-no-files-found: error
          retention-days: 30
  clean-install:
    needs: build
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      RECEIPT_SHA256: ${{ needs.build.outputs.receipt-sha256 }}
      ARTIFACT_SOURCE: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ needs.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *checkout
      - name: Verify immutable identity
        shell: bash
        run: *identity
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Verify fresh install and cleanup
        shell: bash
        run: python3 scripts/ci/macos_candidate.py install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: macos-install-${{ inputs.candidate_sha }}
          path: macos-install/
          if-no-files-found: error
          retention-days: 30
