name: Trusted Publishing auth-only readiness
# Owner setup/proof authority: issues/187#issuecomment-5936778067.
# Lead must read back configs offline before/after; management token never enters CI.
# Owner upload authority: issues/187#issuecomment-5939211059 (eleven 0.1.1 crates).
# Publish mode requires crate_publisher.py to land first. Never rerun a failed batch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Auth-only proof or owner-authorized eleven-crate publication
        required: true
        type: choice
        default: auth-only
        options: [auth-only, publish]
      candidate_sha:
        description: Frozen lowercase 40-character product SHA
        required: true
        type: string
      release_tag:
        description: Existing annotated product tag
        required: true
        type: string
      confirmation:
        description: publish-0.1.1 required for publish; validated before token mint
        required: false
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  readiness:
    if: ${{ inputs.mode == 'auth-only' }}
    runs-on: ubuntu-latest
    environment: G-PUBLISH
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source and verifier
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIER_SHA: ${{ github.sha }}
        run: python3 scripts/ci/trusted_publishing_readiness.py preflight
      - name: Exchange OIDC for temporary token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Revoke token and record auth-only proof
        env:
          TP_TOKEN: ${{ steps.auth.outputs.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIER_SHA: ${{ github.sha }}
        run: python3 scripts/ci/trusted_publishing_readiness.py revoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: trusted-publishing-readiness
          path: trusted-publishing-readiness/
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ inputs.mode == 'publish' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    environment: G-PUBLISH
    timeout-minutes: 25
    concurrency:
      group: publish0.1.1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust before token mint
        uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
        with:
          toolchain: 1.96.0
      - name: Verify authorized frozen batch before token mint
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIER_SHA: ${{ github.sha }}
          UPLOAD_AUTHORIZATION: ${{ inputs.confirmation }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN }}
        run: python3 scripts/ci/crate_publisher.py preflight
      - name: Exchange OIDC for temporary token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish frozen batch; halt on first failure
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIER_SHA: ${{ github.sha }}
          UPLOAD_AUTHORIZATION: ${{ inputs.confirmation }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN }}
          TP_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/ci/crate_publisher.py publish
      # Official auth action post step revokes ephemeral token even on failure.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: crate-publication
          path: |
            crate-publication/*.json
            crate-publication/*.log
          if-no-files-found: error
          retention-days: 30
