name: Trusted Publishing auth-only readiness
# Owner setup/proof authority: issues/187#issuecomment-5936778067.
# Lead must read back configs offline before/after; management token never enters CI.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen lowercase 40-character product SHA
        required: true
        type: string
      release_tag:
        description: Existing annotated product tag
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: G-PUBLISH
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source and verifier
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIER_SHA: ${{ github.sha }}
        run: python3 scripts/ci/trusted_publishing_readiness.py preflight
      - name: Exchange OIDC for temporary token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Revoke token and record auth-only proof
        env:
          TP_TOKEN: ${{ steps.auth.outputs.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIER_SHA: ${{ github.sha }}
        run: python3 scripts/ci/trusted_publishing_readiness.py revoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: trusted-publishing-readiness
          path: trusted-publishing-readiness/
          if-no-files-found: error
          retention-days: 30
