# release.yml — owner-controlled Unix-first artifact pipeline.
#
# Public artifact matrix is exact: macOS arm64 and Linux x86_64. macOS x86_64,
# Linux aarch64, and Windows have no artifact or support claim in this pipeline.
# Tags never create assets or releases. Every remote upload/release job requires
# GitHub Environment G-PUBLISH approval after manual dispatch.

name: release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen R0 candidate commit SHA
        required: true
        type: string
      release_tag:
        description: Existing v<version> tag pointing at candidate SHA
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os-tag }}-${{ matrix.arch-tag }})
    runs-on: ${{ matrix.runner }}
    environment: G-PUBLISH
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            os-tag: darwin
            arch-tag: arm64
            rust-target: aarch64-apple-darwin
            features: vz
          - runner: ubuntu-latest
            os-tag: linux
            arch-tag: x86_64
            rust-target: x86_64-unknown-linux-gnu
            features: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify owner-selected candidate and tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          case "${{ inputs.release_tag }}" in v[0-9]*) ;; *) exit 1 ;; esac
          test "$(git rev-parse "${{ inputs.release_tag }}^{}")" = "${{ inputs.candidate_sha }}"
          VERSION="$(grep -A 10 '^\[workspace\.package\]' Cargo.toml | grep '^version' | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
          test "${{ inputs.release_tag }}" = "v${VERSION}"

      - name: Install toolchain (honor rust-toolchain.toml)
        run: rustup show

      - name: Add rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --locked --release --bin lightr --target ${{ matrix.rust-target }} --features "${{ matrix.features }}"
          else
            cargo build --locked --release --bin lightr --target ${{ matrix.rust-target }}
          fi

      - name: Sign and notarize (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        run: |
          set -euo pipefail
          BINARY="target/${{ matrix.rust-target }}/release/lightr"
          verify_binary() {
            codesign --verify --strict "$BINARY"
            ENTITLEMENTS_PATH="$RUNNER_TEMP/lightr-entitlements.plist"
            codesign -d --entitlements :- "$BINARY" > "$ENTITLEMENTS_PATH"
            python3 -c 'import plistlib, sys; value = plistlib.load(open(sys.argv[1], "rb")).get("com.apple.security.virtualization"); sys.exit(0 if value is True else "virtualization entitlement must be boolean true")' "$ENTITLEMENTS_PATH"
          }
          if [ -z "${APPLE_CERT}" ] || [ -z "${APPLE_CERT_PASSWORD}" ] || [ -z "${AC_API_KEY}" ] || [ -z "${AC_API_KEY_ID}" ]; then
            codesign -s - --force --entitlements packaging/vz.entitlements "$BINARY"
            verify_binary
            echo "unsigned (ad-hoc virtualization entitlement; no Developer ID; not notarized) — Apple signing credentials incomplete"
            echo "SIGNING_DONE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/lightr-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | tr -d '\"')"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERT" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          codesign --sign "Developer ID Application" --options runtime --timestamp \
            --entitlements packaging/vz.entitlements --verbose "$BINARY"
          verify_binary
          AC_KEY_PATH="$RUNNER_TEMP/ac_api_key.json"
          printf '%s' "$AC_API_KEY" > "$AC_KEY_PATH"
          DMG_PATH="$RUNNER_TEMP/lightr-notarize.dmg"
          hdiutil create -srcfolder "$BINARY" -volname lightr "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --key "$AC_KEY_PATH" --key-id "$AC_API_KEY_ID" --wait
          echo "SIGNING_DONE=true" >> "$GITHUB_ENV"

      - name: Package tarball and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          BINARY="target/${{ matrix.rust-target }}/release/lightr"
          SUFFIX=""
          if [ "${{ matrix.os-tag }}" = darwin ] && [ "${SIGNING_DONE:-false}" != true ]; then
            SUFFIX="-unsigned"
          fi
          ARTIFACT="lightr-${VERSION}-${{ matrix.os-tag }}-${{ matrix.arch-tag }}${SUFFIX}.tar.gz"
          STAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGE_DIR"' EXIT
          install -m 755 "$BINARY" "$STAGE_DIR/lightr"
          tar -czf "$ARTIFACT" -C "$STAGE_DIR" lightr
          if command -v sha256sum >/dev/null 2>&1; then
            SHA256="$(sha256sum "$ARTIFACT" | awk '{print $1}')"
          else
            SHA256="$(shasum -a 256 "$ARTIFACT" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$SHA256" "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os-tag }}-${{ matrix.arch-tag }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: assemble draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: G-PUBLISH
    permissions:
      contents: write
    steps:
      - name: Download Unix-first artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true
      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          cd dist/
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c ./*.sha256
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          draft: true
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
