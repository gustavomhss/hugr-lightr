[workspace]
resolver = "2"
members = [
    "crates/lightr-core",
    "crates/lightr-cri-backend",
    "crates/lightr-store",
    "crates/lightr-index",
    "crates/lightr-run",
    "crates/lightr-cli",
    "crates/lightr-acceptance",
    "crates/lightr-engine",
    "crates/lightr-oci",
    "crates/lightr-build",
    "crates/lightr-init",
    "crates/lightr-views",
]
# OPT-IN, OUT-OF-DEFAULT-BUILD: the CRI composition root (`lightr cri serve`)
# is the ONLY crate that depends on the vendored `lightr-cri` shell (tonic/gRPC).
# Its nested workspace stays outside the default build and preserves the
# dependency firewall (ADR-0017 decision 5). Build it explicitly:
#   cargo build --manifest-path crates/lightr-cri-serve/Cargo.toml
exclude = ["crates/lightr-cri-serve"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/HumanGuardrail/hugr-lightr"
homepage = "https://github.com/HumanGuardrail/hugr-lightr"
readme = "README.md"
# Apache-2.0 license gate is resolved (ADR-0008). Owner approved 0.1.1
# publication preparation (#187, comment 5928309446); actual publishing
# still requires final candidate qualification and explicit owner authorization.
publish = true

[workspace.dependencies]
blake3 = { version = "1", features = ["rayon", "mmap"] }
rayon = "1"
ignore = "0.4"
libc = "0.2"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
assert_cmd = "2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
# Windows FFI — declared here, consumed per-crate under
# [target.'cfg(windows)'.dependencies] windows-sys.workspace = true (so it is
# NEVER pulled on unix builds). Added for the omni cross-platform wave
# (docs/spec/build-spec-omni.md): LockFileEx/UnlockFileEx, FlushFileBuffers,
# named pipes, FSCTL block-clone, OpenProcess/TerminateProcess.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
lightr-core = { path = "crates/lightr-core", version = "=0.1.1" }
lightr-store = { path = "crates/lightr-store", version = "=0.1.1" }
lightr-index = { path = "crates/lightr-index", version = "=0.1.1" }
lightr-init = { path = "crates/lightr-init", version = "=0.1.1" }
lightr-run = { path = "crates/lightr-run", version = "=0.1.1" }
lightr-oci = { path = "crates/lightr-oci", version = "=0.1.1" }
lightr-engine = { path = "crates/lightr-engine", version = "=0.1.1" }
lightr-build = { path = "crates/lightr-build", version = "=0.1.1" }
lightr-views = { path = "crates/lightr-views", version = "=0.1.1" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
